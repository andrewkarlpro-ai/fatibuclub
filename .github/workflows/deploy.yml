name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build Next.js
        run: bun run build

      - name: Build for Cloudflare Workers
        run: bun run cf-build

      - name: Apply D1 schema (idempotent, non-blocking until token has D1 scope)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          # Look up the D1 database id (created once out-of-band via `wrangler d1 create fatibuclub`).
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.find(x=>x.name==='fatibuclub');console.log(r?r.uuid:'');})" 2>/dev/null || echo "")
          if [ -z "$DB_ID" ]; then
            echo "D1 database 'fatibuclub' not found — creating it now."
            DB_ID=$(npx wrangler d1 create fatibuclub --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.result?j.result.uuid:'');})" 2>/dev/null || echo "")
            echo "::warning::D1 database id: $DB_ID — paste it into wrangler.jsonc if newly created."
          fi
          echo "D1 database id: $DB_ID"
          # Apply the schema (safe to re-run; CREATE TABLE IF NOT EXISTS).
          npx wrangler d1 execute fatibuclub --remote --file=migrations/0001_submissions.sql || echo "::warning::D1 schema apply skipped"

      - name: Set RESEND_API_KEY secret on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "Setting RESEND_API_KEY secret on Worker..."
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
